name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Correr la suite
        run: |
          FILES=$(git ls-files | grep -E '\.test\.tsx?$')
          echo "Archivos de test: $(echo "$FILES" | wc -l)"
          npx tsx --test $FILES
