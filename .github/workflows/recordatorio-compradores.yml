name: Recordatorio a compradores

# L–V a las 9:00 y 15:00 Caracas (UTC−4) = 13:00 y 19:00 UTC.
# Lista a cada comprador SUS facturas pendientes de confirmar; si no tiene, no envía.
# La ruta vuelve a verificar la hora de Caracas, así que un retraso de GitHub no envía fuera de horario.
# No va en vercel.json: el plan Hobby solo admite crons diarios y esta ruta ya se dispara aquí.
on:
  schedule:
    - cron: '0 13,19 * * 1-5'
  workflow_dispatch:

jobs:
  recordatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la ruta del recordatorio
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            "https://casainteligente.company/api/cron/recordatorio-compradores"
